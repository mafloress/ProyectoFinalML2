# .github/workflows/batch_inference.yml
name: Pipeline de Inferencia Batch

on:
  schedule:
    # Ejecutar cada 2 horas
    - cron: "0 */2 * * *"
  workflow_dispatch: # Permite la ejecución manual

jobs:
  run-batch-inference:
    name: Ejecutar Inferencia Batch
    runs-on: ubuntu-latest
    environment: 
      name: produccion # O el nombre del entorno donde se configura MLFLOW_TRACKING_URI
      # url: <opcional, si se usa un environment con URL>
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Cargar último modelo de producción desde MLflow Model Registry
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          echo "TODO: Implementar la carga del modelo de producción desde MLflow Model Registry."
          echo "Ejemplo: python scripts/load_production_model.py --model_name 'LendingClub_Default_Prod' --output_path 'models/trained_model.pkl'"
          # Este script (scripts/load_production_model.py) usaría la API de MLflow para descargar el modelo
          # marcado como 'Production' en el Model Registry.
          # La salida 'models/trained_model.pkl' sería usada por el script de inferencia.

      - name: Obtener último lote de características desde el Feature Store
        run: |
          echo "TODO: Implementar la obtención del lote de características desde el Feature Store."
          echo "Ejemplo: python scripts/fetch_feature_batch.py --output_file 'data/processed/batch_features.csv'"
          # Este script (scripts/fetch_feature_batch.py) se conectaría al Feature Store y obtendría
          # los datos más recientes que necesitan predicciones.
          # La salida 'data/processed/batch_features.csv' sería la entrada para el script de inferencia.
          # El script de inferencia debería ser adaptado para leer este archivo en lugar de 'processed_lending_club_data.csv'.
          
      - name: Ejecutar script de inferencia batch
        run: |
          echo "TODO: Implementar la ejecución del script de inferencia."
          # Asumimos que el script `scripts/batch_inference_script.py` ha sido adaptado para:
          # 1. Cargar el modelo desde 'models/trained_model.pkl'.
          # 2. Cargar los datos de batch desde 'data/processed/batch_features.csv' (o un path similar).
          # 3. Guardar las predicciones en 'data/predictions/batch_predictions.csv'.
          echo "Ejecutando script de Python directamente como placeholder:"
          python scripts/batch_inference_script.py 
          # Asegurarse que batch_inference_script.py esté adaptado para usar las rutas correctas.

      - name: Guardar predicciones en Base de Datos/S3
        run: |
          echo "TODO: Implementar el paso para guardar las predicciones."
          echo "Ejemplo: python scripts/save_predictions_to_db.py --predictions_file data/predictions/batch_predictions.csv"
          # Este script (scripts/save_predictions_to_db.py) tomaría 'data/predictions/batch_predictions.csv'
          # y lo cargaría a un sistema de almacenamiento o base de datos de producción.

      - name: Notificar finalización (Opcional)
        run: echo "Pipeline de inferencia batch completado."
