# .github/workflows/training_pipeline.yml
name: Pipeline de Entrenamiento de Modelo

on:
  schedule:
    # Ejecutar semanalmente los domingos a medianoche
    - cron: "0 0 * * 0"
  workflow_dispatch: # Permite la ejecución manual

jobs:
  run-model-training:
    name: Ejecutar Entrenamiento de Modelo
    runs-on: ubuntu-latest
    environment: 
      name: produccion # O el nombre del entorno donde se configura MLFLOW_TRACKING_URI
      # url: <opcional, si se usa un environment con URL>
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pip install jupyter nbconvert # Si se ejecuta el notebook directamente
          
      - name: Cargar características desde el Feature Store
        run: |
          echo "TODO: Implementar el paso para cargar características desde el Feature Store."
          echo "Ejemplo: python scripts/load_from_feature_store.py --output_file processed_lending_club_data.csv"
          # Este script (load_from_feature_store.py) necesitaría ser creado.
          # Su salida 'processed_lending_club_data.csv' sería la entrada para el notebook/script de entrenamiento.

      - name: Configurar MLflow Tracking
        run: |
          echo "Configurando MLflow para usar un servidor de seguimiento remoto..."
          # MLFLOW_TRACKING_URI y otras credenciales (si son necesarias) deben configurarse
          # como secrets en la configuración del repositorio de GitHub y pasarse como variables de entorno.
          # Ejemplo:
          # echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV
          # echo "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}" >> $GITHUB_ENV # Si se usa autenticación básica
          # echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> $GITHUB_ENV # Si se usa autenticación básica
          echo "Asegúrese de que MLFLOW_TRACKING_URI esté configurado como un secret en GitHub."
          echo "Ejemplo: export MLFLOW_TRACKING_URI='http://mi-servidor-mlflow.com:5000'"
          # Para este placeholder, asumimos que el notebook/script leerá esta variable de entorno.

      - name: Ejecutar notebook de entrenamiento de modelo
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }} # Ejemplo de cómo pasar el secret
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }} # Si MLflow o los datos están en S3
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }} # Si MLflow está en Databricks
          # DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "TODO: Implementar la ejecución del notebook/script de entrenamiento de modelo."
          echo "Ejemplo: jupyter nbconvert --to script model_training_notebook.ipynb && python model_training_notebook.py"
          # El notebook/script debe usar la variable de entorno MLFLOW_TRACKING_URI para conectarse.

      - name: Registro del Modelo en MLflow Model Registry
        run: |
          echo "TODO: Este paso es conceptual. El registro del modelo usualmente ocurre dentro del script de entrenamiento."
          echo "El script de entrenamiento (model_training_notebook.py) debería usar mlflow.register_model(...)"
          echo "después de loguear el modelo con mlflow.sklearn.log_model(...)."
          
      - name: Notificar finalización (Opcional)
        run: echo "Pipeline de entrenamiento de modelo completado."
